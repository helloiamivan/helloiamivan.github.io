<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Apply saved theme before first paint (defaults to light)
    (function () {
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}Ivan Chan — Quantitative Trading &amp; Research{% endif %}">
  <title>{% if page.title %}{{ page.title }}{% else %}Ivan Chan — Quantitative Trading &amp; Research{% endif %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    html { scroll-behavior: smooth; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }
    .animate-rise { animation: rise 0.55s ease-out both; }
    @media (prefers-reduced-motion: reduce) {
      .animate-rise { animation: none; }
    }
  </style>
</head>
<body class="bg-[#efe5cf] font-sans text-slate-700 antialiased transition-colors duration-300 dark:bg-slate-950 dark:text-slate-300 print:bg-white">

  <!-- decorative background -->
  <div aria-hidden="true" class="pointer-events-none fixed inset-0 overflow-hidden print:hidden">
    <div class="absolute -left-24 -top-24 h-96 w-96 rounded-full bg-indigo-300/40 blur-3xl dark:bg-indigo-600/15"></div>
    <div class="absolute -right-24 top-1/4 h-[28rem] w-[28rem] rounded-full bg-sky-300/35 blur-3xl dark:bg-sky-600/10"></div>
    <div class="absolute -left-32 bottom-0 h-80 w-80 rounded-full bg-emerald-300/25 blur-3xl dark:bg-emerald-600/10"></div>
  </div>

  <main class="relative w-full px-4 py-8 sm:px-6 sm:py-10 lg:px-10 lg:py-12 xl:px-16">
    {{ content }}
  </main>

  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var root = document.documentElement;
        var dark = root.classList.toggle('dark');
        try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
